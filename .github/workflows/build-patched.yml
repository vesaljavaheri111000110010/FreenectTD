name: Build patched FreenectTOP

on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check source has the fix
        run: grep -n "hasNewFrame" FreenectV2.cpp

      - name: Build
        run: |
          xcodebuild -version
          SCHEME=$(xcodebuild -list -project FreenectTD.xcodeproj | awk '/Schemes:/{f=1;next} f&&NF{sub(/^[ \t]+/,"");print;exit}')
          echo "Scheme: $SCHEME"
          xcodebuild -project FreenectTD.xcodeproj -scheme "$SCHEME" -configuration Release \
            -derivedDataPath ./build_out ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Package
        run: |
          PLUGIN=$(find ./build_out -name "FreenectTOP.plugin" -type d | head -1)
          test -n "$PLUGIN"
          codesign --force --deep --sign - "$PLUGIN"
          ditto -c -k --keepParent "$PLUGIN" FreenectTOP_patched.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FreenectTOP-patched
          path: FreenectTOP_patched.zip
